name: Infrastructure CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-postgres-password
          TURN_SHARED_SECRET: ci-only-turn-secret
          TOMO_SIGNALING_IMAGE: tomo-signaling:ci
          TOMO_GAME_SERVER_IMAGE: tomo-game-server:ci
          TOMO_WEB_IMAGE: tomo-web:ci
          PUBLIC_IP: 127.0.0.1
        run: docker compose config
